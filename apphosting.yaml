# Firebase App Hosting build/run config for the Next.js app.
# See docs/DEPLOYMENT.md for the full runbook (region choice, secrets setup, first rollout).

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Public Firebase client config — inlined into the client bundle at build
  # time by Next.js, so these need BUILD availability (not just RUNTIME).
  # Not secrets: protected by Firestore/Storage Security Rules, not by hiding
  # this config (see docs/SECURITY.md).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyBTX7UVWoOf6-_UGZZTahB47khE9c8bmFs"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "shovarim-prod.firebaseapp.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "shovarim-prod"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "shovarim-prod.firebasestorage.app"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "340911758477"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:340911758477:web:9ca5c245abd2ddfae3d6c4"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_USE_FIREBASE_EMULATOR
    value: "false"
    availability: [BUILD, RUNTIME]

  # Firebase App Check (docs/SECURITY.md threat #4). Not a secret — identifies
  # the site to reCAPTCHA, same trust model as the other NEXT_PUBLIC_* config
  # above. This is a reCAPTCHA *Enterprise* key id (docs/DECISIONS.md ADR #28);
  # a classic v3 key also starts with "6L" but will not validate against an
  # Enterprise-registered app, and nothing in the code can tell the two apart.
  # Created 2026-08-29 in Google Cloud Console -> Security -> reCAPTCHA
  # (website key, score-based) for the App Hosting hostname, and registered
  # under Firebase Console -> App Check -> Apps -> reCAPTCHA Enterprise.
  #
  # This value is inlined into the client bundle at BUILD time and comes from
  # nowhere else — registering in the Console alone does NOT enable App Check,
  # which is why it sat as "REPLACE_ME" here while App Check was silently off
  # (src/lib/firebase/appCheck.ts skips init on a placeholder, ADR #27).
  # Changing the hostname (custom domain) means adding it to the key's domain
  # list too, or every client fails with "Invalid domain for site key".
  - variable: NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY
    value: "6LcPWZ4tAAAAACiJlP9uCXFcvFS-VOA1URY-DUfz"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APPCHECK_DEBUG
    value: "false"
    availability: [BUILD, RUNTIME]

  # Server-only Admin SDK config. BUILD availability is required too, not
  # just RUNTIME: src/lib/firebase/adminApp.ts builds the Admin SDK app
  # eagerly at module import time, and `next build` imports that module
  # while tracing the app — without these present at build time it throws
  # "Missing Firebase Admin credentials" and the whole build fails.
  - variable: FIREBASE_USE_EMULATOR
    value: "false"
    availability: [BUILD, RUNTIME]
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: "shovarim-prod"
    availability: [BUILD, RUNTIME]
  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    value: "firebase-adminsdk-fbsvc@shovarim-prod.iam.gserviceaccount.com"
    availability: [BUILD, RUNTIME]
  # Real secret — never a plaintext value. Populate via
  # Set-AppHosting-AdminKey.ps1 (wraps `firebase apphosting:secrets:set` +
  # `grantaccess`) before the first rollout.
  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: firebase-admin-private-key
    availability: [BUILD, RUNTIME]

  # AES-256 key for application-level encryption of cvv/barcodeOrCode
  # (src/lib/crypto/fieldEncryption.ts) — a defense-in-depth layer beyond
  # Firestore's at-rest encryption, see docs/SECURITY.md. RUNTIME only: the
  # key is parsed lazily inside encrypt/decrypt calls, not at module import
  # time like adminApp.ts, so next build never needs it. Populate via
  # Set-AppHosting-CardEncryptionKey.ps1 before the first rollout that uses
  # it; generate the value with
  # `node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"`.
  - variable: CARD_FIELD_ENCRYPTION_KEY
    secret: card-field-encryption-key
    availability: [RUNTIME]

  # Pins the key Next derives every Server Action id from. Without it, a build
  # that finds no warm cache generates a fresh random key (loadOrGenerateKey in
  # node_modules/next/dist/server/app-render/encryption-utils-server.js), so
  # EVERY action id changes — and each App Hosting rollout builds in a clean
  # container, including docs-only rollouts. Any tab still holding the previous
  # bundle then POSTs an id the new server has never heard of, and Next answers
  # 404 ("Server action not found", x-nextjs-action-not-found: 1) with no hint
  # that a redeploy is the cause. That is the 2026-08-30 export failure, and it
  # applies to every Server Action in the app, not just that one.
  #
  # ⚠️ Locally this looks like a non-problem: Next caches the key in
  # .next/cache/.rscinfo and reuses it across builds, so two local builds agree
  # — until the 14-day expiry, a `rm -rf .next`, or a CI container without that
  # cache. Measured here: two clean builds with this key pinned produced
  # byte-identical ids; without it, 0 of 18 ids survived.
  #
  # BUILD availability is the load-bearing one: the value is baked into
  # .next/server/server-reference-manifest.json at build time. RUNTIME is kept
  # for the Edge runtime, which reads it from the environment instead.
  #
  # Rotating this value invalidates every open client the same way a missing
  # key does, so treat it as permanent. Populate via
  # Set-AppHosting-ActionsEncryptionKey.ps1 BEFORE this entry reaches main — a
  # rollout referencing a nonexistent secret fails and does not retry (the
  # Phase 4.3 outage, docs/DEPLOYMENT.md).
  - variable: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
    secret: next-server-actions-encryption-key
    availability: [BUILD, RUNTIME]

  # Anthropic Claude API — production authenticates via Workload Identity
  # Federation (src/lib/mcp/anthropicClient.ts, docs/DECISIONS.md ADR #20),
  # not a static ANTHROPIC_API_KEY. These are configuration IDs, not
  # secrets — the actual credential is a short-lived token minted at request
  # time from this backend's own attached GCP service account. RUNTIME only:
  # createAnthropicClient() builds the client lazily inside a function call,
  # not eagerly at module import time like adminApp.ts, so next build never
  # needs these. Deliberately no ANTHROPIC_API_KEY entry here — the SDK's
  # credential precedence puts a static key above federation, so adding one
  # would silently disable WIF.
  - variable: ANTHROPIC_FEDERATION_RULE_ID
    value: "fdrl_018ttdqgfnFje2RjNdfmt2h1"
    availability: [RUNTIME]
  - variable: ANTHROPIC_ORGANIZATION_ID
    value: "63d0ff42-6f87-41dc-bbed-0be8d6fd950e"
    availability: [RUNTIME]
  - variable: ANTHROPIC_SERVICE_ACCOUNT_ID
    value: "svac_01VdXZJzaU6NXrcqnEwc1b2Z"
    availability: [RUNTIME]
  - variable: ANTHROPIC_WORKSPACE_ID
    value: "wrkspc_01NNmbmN2Yi3LBEaEzYm8bEr"
    availability: [RUNTIME]

  # WhatsApp Cloud API (docs/ROADMAP.md Phase 5.5.c, docs/DECISIONS.md ADR #30).
  # RUNTIME only: src/lib/whatsapp/config.ts reads these lazily inside the
  # request handler, so next build never needs them — the opposite of the eager
  # FIREBASE_ADMIN_* reads above. Until all of them are populated the webhook
  # answers 503 rather than crashing, which is the state the code shipped in.
  #
  # Populate with Set-AppHosting-WhatsAppSecrets.ps1 BEFORE this file reaches
  # main — a rollout referencing a secret that does not exist fails and does not
  # retry (the Phase 4.3 outage, see the postmortem in docs/DEPLOYMENT.md).
  #
  # An identifier, not a secret. Also filters out deliveries for other business
  # numbers under the same Meta app. Keep the real value out of .env.local:
  # tests/e2e/whatsapp.spec.ts signs payloads carrying "E2E_PHONE_ID", and a
  # real id there makes the route skip every one of them.
  - variable: WHATSAPP_PHONE_NUMBER_ID
    value: "963623680178719"
    availability: [RUNTIME]
  # Verifies X-Hub-Signature-256 over the raw body of every inbound delivery.
  - variable: WHATSAPP_APP_SECRET
    secret: whatsapp-app-secret
    availability: [RUNTIME]
  # Permanent System User token used to send replies through the Graph API.
  # Never the 24-hour temporary token: when it expires, inbound messages still
  # run tools and mutate data while every reply is dropped with a log line —
  # indistinguishable from a dead bot.
  - variable: WHATSAPP_ACCESS_TOKEN
    secret: whatsapp-access-token
    availability: [RUNTIME]
  # Ours to choose, but it must match the value entered in Meta -> WhatsApp ->
  # Configuration -> Webhook exactly, or the GET handshake returns 403 and the
  # webhook cannot be registered at all.
  - variable: WHATSAPP_VERIFY_TOKEN
    secret: whatsapp-verify-token
    availability: [RUNTIME]
