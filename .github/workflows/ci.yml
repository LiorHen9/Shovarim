name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `next build` doesn't need real Firebase credentials.
      # src/lib/firebase/adminApp.ts initializes eagerly at import time and
      # takes the emulator branch (no real creds required) when
      # FIREBASE_USE_EMULATOR=true — see docs/DEPLOYMENT.md.
      NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-shovarim.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-shovarim
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-shovarim.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
      NEXT_PUBLIC_USE_FIREBASE_EMULATOR: "true"
      FIREBASE_USE_EMULATOR: "true"
      # Dummy AES-256 key so createCard/updateCardDetails/getCardSecrets
      # (src/lib/crypto/fieldEncryption.ts) don't throw in CI — this is a
      # fixed value used only to encrypt/decrypt test fixtures against the
      # emulator, never a real secret (see docs/DEPLOYMENT.md for the real
      # per-environment key setup).
      CARD_FIELD_ENCRYPTION_KEY: "DzSypG4OA6dhGFcc1hhTdgZDXj6degkAJ6WO9eVuUQg="
      # Fixed dummy values so tests/e2e/whatsapp.spec.ts can sign a webhook
      # delivery the way Meta would (docs/ROADMAP.md Phase 5.5.b). The real
      # ones are Secret Manager references in apphosting.yaml and never appear
      # here. WHATSAPP_ACCESS_TOKEN/PHONE_NUMBER_ID stay unset on purpose:
      # without outbound credentials the handler logs the reply instead of
      # calling graph.facebook.com from CI.
      WHATSAPP_APP_SECRET: e2e-local-app-secret
      WHATSAPP_VERIFY_TOKEN: e2e-local-verify-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Pure-logic tests — no emulator needed, so they run before the slow
      # build rather than inside the emulators:exec block below.
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Rules + E2E tests (emulator)
        run: npx firebase emulators:exec --only firestore,auth,storage --project demo-shovarim "npm run test:rules && npm run test:e2e"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  deploy-rules-and-functions:
    needs: [quality, functions]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run build --prefix functions
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      - run: npx firebase deploy --only firestore:rules,firestore:indexes,storage,functions --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive
